name: Supervisor Edition checks

on:
  push:
    branches: [supervisor-edition]
  pull_request:
    branches: [supervisor-edition]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Tesseract on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run baseline and supervisor tests
        run: python -m pytest -q
